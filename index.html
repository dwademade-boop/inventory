<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Erik's personal inventory: everything he owns, with photos, buy links and live market values.">
<meta name="referrer" content="no-referrer">
<style>:root{color-scheme:light}body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Erik's Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
</head><body>
<style>
/* Layout: a catalogue register — summary ledger on top, filter rail, photo grid of tagged items, detail drawer from the right (bottom sheet on phones). */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --sunk:#E2E6EB; --ink:#12161B; --muted:#5B6672; --line:#D3D9E0;
  --accent:#2B45D8; --accent-ink:#FFFFFF; --accent-soft:#E0E5FF;
  --tag:#FFD84A; --tag-ink:#2A2200;
  --good:#1E7F4F; --good-soft:#DDF3E7; --warn:#A35A00; --warn-soft:#FDEBD3; --bad:#B42318;
  --tile-l:90%; --tile-fg-l:36%; --shadow:0 1px 2px rgba(18,22,27,.06),0 8px 24px rgba(18,22,27,.08);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1014; --surface:#161A20; --sunk:#1D232B; --ink:#E8ECF1; --muted:#8E99A6; --line:#2A313A;
  --accent:#8A9BFF; --accent-ink:#0D1014; --accent-soft:#1F2544; --tag:#E8C33A; --tag-ink:#1C1600;
  --good:#5CCB92; --good-soft:#15301F; --warn:#F0A54A; --warn-soft:#33240F; --bad:#FF8A80;
  --tile-l:19%; --tile-fg-l:74%; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1014; --surface:#161A20; --sunk:#1D232B; --ink:#E8ECF1; --muted:#8E99A6; --line:#2A313A;
  --accent:#8A9BFF; --accent-ink:#0D1014; --accent-soft:#1F2544; --tag:#E8C33A; --tag-ink:#1C1600;
  --good:#5CCB92; --good-soft:#15301F; --warn:#F0A54A; --warn-soft:#33240F; --bad:#FF8A80;
  --tile-l:19%; --tile-fg-l:74%; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:max(16px,3vw);padding-block:20px 80px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brandmark{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5.4vw,56px);line-height:.95;letter-spacing:-.025em;margin:0;text-wrap:balance}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn svg{width:17px;height:17px;flex:none}
.btn[disabled]{opacity:.5;cursor:default}

/* ledger */
.ledger{margin-top:22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ledger>div{padding:14px 18px;border-left:1px solid var(--line);min-width:0}
.ledger>div:first-child{border-left:0}
.ledger .k{font-size:12px;color:var(--muted);font-weight:500}
.ledger .v{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3vw,30px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.ledger .s{font-size:12px;color:var(--muted)}
@media (max-width:720px){.ledger{grid-template-columns:repeat(2,minmax(0,1fr))}.ledger>div:nth-child(3){border-left:0}.ledger>div:nth-child(n+3){border-top:1px solid var(--line)}}

/* notice */
.notice{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:12px 16px}
.notice p{margin:0;min-width:0;flex:1 1 280px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1 1 100%}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* tabs & tools */
.tabs{margin-top:26px;display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 14px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.tab .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:4px}
.tools{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;padding:10px 0;width:100%;min-width:0}
select.sel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 10px;color:var(--muted);display:flex}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
.seg svg{width:18px;height:18px}
.chips{margin-top:12px;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:hsl(var(--h) 60% 50%)}
.chip.flag[aria-pressed="true"]{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}

/* grid */
.grid{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.thumb{aspect-ratio:4/3;width:100%;max-width:100%;background:hsl(var(--h) 45% var(--tile-l));display:grid;place-items:center;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ico{width:38%;max-width:84px;color:hsl(var(--h) 45% var(--tile-fg-l));opacity:.9}
.thumb .ico svg{width:100%;height:auto;display:block}
.tagno{position:absolute;left:8px;top:8px;background:var(--surface);color:var(--ink);font-family:var(--f-mono);font-size:10.5px;padding:3px 7px 3px 12px;border-radius:4px;letter-spacing:.04em}
.tagno::before{content:"";position:absolute;left:4px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--muted)}
.qty{position:absolute;right:8px;top:8px;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:999px}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.cname{font-weight:600;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cbrand{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow{margin-top:auto;padding-top:6px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.price{font-family:var(--f-mono);font-size:13px;font-weight:500}
.price small{color:var(--muted);font-weight:400}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--tag);color:var(--tag-ink)}
.pill.refill{background:var(--good-soft);color:var(--good)}
.pill.heart{background:var(--warn-soft);color:var(--warn)}
.pill.gone{background:var(--sunk);color:var(--muted)}
.card.isgone .thumb{filter:grayscale(1);opacity:.75}

/* list view */
.list{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .thumb{aspect-ratio:1;border-radius:10px;width:56px}
.row .thumb .ico{width:50%}
.row .meta{min-width:0}
.row .meta .cname{-webkit-line-clamp:1}
.row .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* subscriptions */
.subsum{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline}
.subsum b{font-family:var(--f-display);font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.subsum span{color:var(--muted);font-size:13px}

.empty{margin-top:24px;padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.empty h3{font-family:var(--f-display);color:var(--ink);font-size:20px;margin:0 0 6px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:21;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
@media (max-width:640px){.drawer{top:auto;left:0;width:100%;max-height:92%;border-radius:18px 18px 0 0;transform:translateY(102%);padding-top:0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dhead .eyebrow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{border:0;background:var(--sunk);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.dbody{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.hero{border-radius:14px;overflow:hidden}
.hero .thumb{aspect-ratio:4/3}
.hero .thumb img{object-fit:contain;background:var(--sunk)}
.dtitle{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.dsub{color:var(--muted);margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.facts{display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr);border-top:1px solid var(--line)}
.facts dt,.facts dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);font-size:13px;padding-right:12px}
.facts dd{overflow-wrap:anywhere}
.valuebox{background:var(--sunk);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.valuebox .big{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.valuebox .delta{font-family:var(--f-mono);font-size:12px}
.up{color:var(--good)} .down{color:var(--bad)}
.spark{width:100%;height:64px;display:block}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.f2{grid-template-columns:1fr}}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}
label.fld span.h{font-weight:400;color:var(--muted);font-size:12px}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0;font-weight:400;font-size:15px}
.fld textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.photo-drop{border:1.5px dashed var(--line);border-radius:14px;overflow:hidden;display:grid;place-items:center;aspect-ratio:16/9;max-width:100%;background:var(--bg);position:relative;cursor:pointer;text-align:center;color:var(--muted);padding:12px}
.photo-drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-drop.over{border-color:var(--accent)}
.reasons{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.reasons button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-weight:600;text-align:left}
.reasons button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted)}
.err{color:var(--bad);font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;z-index:40;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:999px;padding:14px 18px;box-shadow:var(--shadow)}
@media (min-width:721px){.fab{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brandmark">
      <span class="eyebrow" id="who">Erik's personal inventory</span>
      <h1>Everything I Own</h1>
    </div>
    <div class="top-actions">
      <button class="btn ghost" id="exportBtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Spreadsheet</button>
      <button class="btn primary" id="addBtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add item</button>
    </div>
  </header>

  <section class="ledger" aria-label="Summary">
    <div><div class="k">Things I own</div><div class="v" id="sCount">—</div><div class="s" id="sCountS">&nbsp;</div></div>
    <div><div class="k">Estimated worth</div><div class="v" id="sWorth">—</div><div class="s" id="sWorthS">&nbsp;</div></div>
    <div><div class="k">Recurring costs</div><div class="v" id="sMonthly">—</div><div class="s" id="sMonthlyS">&nbsp;</div></div>
    <div><div class="k">Let go</div><div class="v" id="sGone">—</div><div class="s" id="sGoneS">&nbsp;</div></div>
  </section>

  <div class="notice" id="importNote" hidden>
    <p id="importText"></p>
    <button class="btn primary" id="importBtn">Bring photos in</button>
    <div class="bar" id="importBar" hidden><i></i></div>
  </div>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="things" aria-selected="true">Things<span class="n" id="nThings"></span></button>
    <button class="tab" role="tab" data-tab="recurring" aria-selected="false">Subscriptions &amp; bills<span class="n" id="nRec"></span></button>
    <button hidden class="tab" role="tab" data-tab="docs" aria-selected="false">Documents<span class="n" id="nDocs"></span></button>
    <button class="tab" role="tab" data-tab="gone" aria-selected="false">Let go<span class="n" id="nGone"></span></button>
  </nav>

  <div class="tools" id="tools">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search name, brand, notes…" aria-label="Search"></label>
    <select class="sel" id="sort" aria-label="Sort">
      <option value="no">Catalogue order</option>
      <option value="recent">Recently added</option>
      <option value="name">Name A–Z</option>
      <option value="value">Worth, high to low</option>
      <option value="date">Purchase date, newest</option>
    </select>
    <div class="seg" role="group" aria-label="Layout">
      <button id="vGrid" aria-pressed="true" title="Photo grid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
      <button id="vList" aria-pressed="false" title="List"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
    </div>
  </div>
  <div class="chips" id="chips"></div>

  <main id="view"><div class="empty"><h3>Opening your inventory…</h3>Your things load in a moment.</div></main>
</div>

<button class="btn primary fab" id="fab" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dLabel">
  <div class="dhead"><span class="eyebrow" id="dLabel"></span><button class="icon-btn" id="dClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot" id="dFoot" hidden></div>
</aside>

const STORES={amazon:"Amazon",walmart:"Walmart",target:"Target",bestbuy:"Best Buy",bhphotovideo:"B&H",ebay:"eBay",swappa:"Swappa",cargurus:"CarGurus",acehardware:"Ace",vitacost:"Vitacost",wholefoodsmarket:"Whole Foods",evo:"evo",adorama:"Adorama",staples:"Staples",ems:"EMS",kentfaith:"K&F Concept",usa:"Philips",nam:"BIC",thenorthface:"The North Face",ralphlauren:"Ralph Lauren",outdoorresearch:"Outdoor Research",allbirds:"Allbirds",smartwool:"Smartwool",packtowl:"PackTowl",westerndigital:"WD",dji:"DJI",jbl:"JBL",lifestraw:"LifeStraw",drbronner:"Dr. Bronner's",burtsbees:"Burt's Bees",mace:"Mace",taser:"TASER",ledger:"Ledger",flipper:"Flipper",apple:"Apple",anker:"Anker",sandisk:"SanDisk",seagate:"Seagate",rode:"RØDE",columbia:"Columbia",vibram:"Vibram",speedo:"Speedo",zerowater:"ZeroWater",invisibobble:"invisibobble",pelican:"Pelican",sharpie:"Sharpie",gosun:"GoSun",feelworld:"FeelWorld",amarancreators:"amaran",tuneupfitness:"Tune Up Fitness",cliganic:"Cliganic",vapur:"Vapur",renpho:"RENPHO",snailax:"Snailax",ulanzi:"Ulanzi",nutiva:"Nutiva",uniballco:"uni-ball",injinji:"Injinji",adidas:"adidas",explodingkittens:"Exploding Kittens",portagenotebooks:"Portage",aspenkaynaturals:"Aspen Kay",rocketpure:"Rocket Pure",merino:"Merino.tech"};
function storeName(u){ try{ const h=new URL(u).hostname.replace(/^(www|us|shop|store|m)\./,""); const k=h.split(".")[0]; return STORES[k]||h; }catch(e){ return ""; } }

function pills(it){
  const p=[];
  if(!isOwned(it)) p.push(`<span class="pill gone">${esc(REASON_LABEL[it.closed?.reason]||"Let go")}</span>`);
  else{
    if(it.trackValue) p.push('<span class="pill live">Tracked</span>');
    if(it.consumable) p.push('<span class="pill refill">Refill</span>');

function priceLine(it){
  if(!isOwned(it)&&it.closed?.amount!=null) return `${money(it.closed.amount)} <small>sold</small>`;
  if(it.kind==="subscription"||it.kind==="bill") return it.cost!=null?`${money(it.cost)} <small>/ ${esc(it.period||"month")}</small>`:"";
  if(it.value!=null) return `${money(it.value)} <small>now</small>`;
  if(it.price!=null) return `${money(it.price)}${it.gift?' <small>gift</small>':''}`;
  return it.gift?'<small>Gift</small>':'';
}

/* filtering */
function inTab(it){
  if(tab==="gone") return !isOwned(it);
  if(!isOwned(it)) return false;
  if(tab==="things") return isThing(it);
  if(tab==="recurring") return it.kind==="subscription"||it.kind==="bill";
  if(tab==="docs") return it.kind==="document";
}
function matches(it){
  if(cat && it.category!==cat) return false;
  if(flag==="track"&&!it.trackValue) return false;
  if(flag==="refill"&&!it.consumable) return false;
  if(flag==="heart"&&!it.sentimental) return false;
  if(flag==="nophoto"&&it.photoId) return false;
  if(query){
    const hay=[it.name,it.brand,it.notes,it.serial,it.category,it.location,tagNo(it.no)].join(" ").toLowerCase();
    if(!query.split(/\s+/).every(w=>hay.includes(w))) return false;
  }
  return true;
}
function sorted(list){
  const by={
    no:(a,b)=>(a.no||0)-(b.no||0),
    recent:(a,b)=>String(b.added||"").localeCompare(String(a.added||""))||(b.no||0)-(a.no||0),
    name:(a,b)=>a.name.localeCompare(b.name),
    value:(a,b)=>(tab==="recurring"?monthly(b)-monthly(a):worth(b)-worth(a)),
    date:(a,b)=>String(b.purchased||"").localeCompare(String(a.purchased||""))
  };
  if(tab==="gone") return list.sort((a,b)=>String(b.closed?.date||"").localeCompare(String(a.closed?.date||""))||(a.no||0)-(b.no||0));
  return list.sort(by[sort]||by.no);
}

/* render */
function renderSummary(){
  const all=[...items.values()];
  const owned=all.filter(i=>isOwned(i)&&isThing(i));
  const count=owned.reduce((s,i)=>s+(i.qty||1),0);
  $("#sCount").textContent=count.toLocaleString();
  $("#sCountS").textContent=new Set(owned.map(i=>i.category)).size+" categories";
  const w=owned.reduce((s,i)=>s+worth(i),0);
  $("#sWorth").textContent=money(Math.round(w),0);
  const tracked=owned.filter(i=>i.trackValue&&i.valueUpdated).map(i=>i.valueUpdated).sort().pop();
  $("#sWorthS").textContent=tracked?"Market prices checked "+fmtDate(tracked):"Purchase prices until market check";
  const rec=all.filter(i=>isOwned(i)&&(i.kind==="subscription"||i.kind==="bill"));
  const m=rec.reduce((s,i)=>s+monthly(i),0);
  $("#sMonthly").innerHTML=money(Math.round(m),0)+'<span style="font-size:.5em;color:var(--muted);font-weight:500"> /mo</span>';
  $("#sMonthlyS").textContent=money(Math.round(m*12),0)+" a year · "+rec.length+" running";
  const gone=all.filter(i=>!isOwned(i));
  $("#sGone").textContent=gone.length;
  const recouped=gone.reduce((s,i)=>s+(i.closed?.amount||0),0);
  $("#sGoneS").textContent=recouped?money(recouped,0)+" recouped from sales":"Sold, given, used up";
  $("#nThings").textContent=owned.length;
  $("#nRec").textContent=rec.length;
  $("#nDocs").textContent=all.filter(i=>isOwned(i)&&i.kind==="document").length;
  $("#nGone").textContent=gone.length||"";
}
function renderChips(){

  const cats=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);

  $("#chips").innerHTML=h;
}
function cardHTML(it){
  return `<button class="card${isOwned(it)?"":" isgone"}" data-id="${esc(it.id)}">
    <div style="position:relative">${thumbHTML(it)}<span class="tagno">${tagNo(it.no)}</span>${(it.qty||1)>1?`<span class="qty">×${it.qty}</span>`:""}</div>

function rowHTML(it){

function render(){
  if(!loaded) return;
  renderSummary(); renderChips();
  $("#vGrid").setAttribute("aria-pressed",layout==="grid");$("#vList").setAttribute("aria-pressed",layout==="list");
  const list=sorted([...items.values()].filter(i=>inTab(i)&&matches(i)));

/* detail */
function spark(hist){
  if(!hist||hist.length<2) return "";
  const W=400,H=64,P=6; const vs=hist.map(p=>p.v); const mn=Math.min(...vs),mx=Math.max(...vs); const r=mx-mn||1;
  const pts=hist.map((p,i)=>[P+i*(W-2*P)/(hist.length-1),H-P-(p.v-mn)/r*(H-2*P)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d} L${last[0]} ${H} L${P} ${H}Z" fill="var(--accent)" opacity=".12"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--accent)"/></svg>`;
}

function fact(k,v){ return v?`<dt>${k}</dt><dd>${v}</dd>`:""; }
function renderDetail(it){

  if(isOwned(it)){

    else if(it.kind==="item"){
      a+=`<a class="btn ${it.consumable?"primary":""}" href="${esc(buyLink(it))}" target="_blank" rel="noopener">${I('<path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.3h8.6a1.5 1.5 0 0 0 1.5-1.2L20.5 8H6"/><circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/>',2)}${it.buyUrl?(it.consumable?"Reorder":it.buySimilar?"Shop similar":"Buy again")+" at "+esc(storeName(it.buyUrl)):(it.consumable?"Reorder":"Search Amazon")}</a>`;
      a+=`<a class="btn ${it.trackValue&&!it.consumable?"primary":""}" href="${esc(valueLink(it))}" target="_blank" rel="noopener">${I('<path d="M4 18 9 12l4 3 7-8"/><path d="M15 7h5v5"/>',2)}Market price</a>`;
    }
  }
  if(it.driveId) a+=`<a class="btn ghost" href="https://drive.google.com/file/d/${esc(it.driveId)}/view" target="_blank" rel="noopener">Original photo</a>`;

    if(it.price&&it.value!=null){const d=it.value-it.price;delta=`<span class="delta ${d>=0?"up":"down"}">${d>=0?"+":"−"}${money(Math.abs(d),0)} vs. ${money(it.price,0)} paid</span>`;}
    vb=`<div class="valuebox"><div class="eyebrow">${it.trackValue?"Market value · checked daily":"Current value"}</div>

  }

    facts+=fact("Renews / due",esc(it.due||""));
  } else {

    facts+=fact("Bought",fmtDate(it.purchased));
    facts+=fact("Quantity",(it.qty||1)>1?String(it.qty):"");
    facts+=fact("Mileage",it.mileage?`<span class="mono">${Number(it.mileage).toLocaleString()} mi</span>${it.mileageDate?` <span class="hint">as of ${fmtDate(it.mileageDate)}</span>`:""}`:"");

    $("#photoBtn").onclick=()=>pickPhoto(async blob=>{await savePhoto(it.id,blob);});
    if($("#goBtn")) $("#goBtn").onclick=()=>renderLetGo(it);
    if($("#restoreBtn")) $("#restoreBtn").onclick=async()=>{await write(it.id,{status:"owned",closed:{__del:1}});toast("Back in your things");};
  } else f.hidden=true;
}

      <label class="fld">Every<select id="f_period">${Object.keys(PERIODS).map(p=>opt(p,p,(it.period||"month")===p)).join("")}</select></label>
    </div>
    <label class="fld onlyrec">Renews / due<input id="f_due" value="${esc(it.due||"")}" placeholder="e.g. 27th, or 2027-05-20"></label>
    <label class="fld onlyrec">Link to manage it<input id="f_manage" type="url" value="${esc(it.manageUrl||"")}" placeholder="https://"></label>
    <div class="f2 onlyitem">
      <label class="fld">Serial / model<input id="f_serial" value="${esc(it.serial||"")}"></label>
      <label class="fld">How often I use it<select id="f_usage">${["","Everyday","Every Week","Every Month","Every Year","Rarely"].map(u=>opt(u,u||"—",(it.usage||"")===u)).join("")}</select></label>
    </div>
    <label class="fld onlyitem">Kept at <span class="h">optional</span><input id="f_loc" value="${esc(it.location||"")}"></label>
    <label class="fld onlyitem">Where to buy more <span class="h">leave blank to search Amazon</span><input id="f_buy" type="url" value="${esc(it.buyUrl||"")}" placeholder="https://"></label>
    <label class="fld onlyitem">Where to check its price <span class="h">leave blank for eBay sold listings</span><input id="f_vurl" type="url" value="${esc(it.valueUrl||"")}" placeholder="https://"></label>
    <label class="fld">Notes<textarea id="f_notes" placeholder="Where it came from, sizes, materials, the story…">${esc(it.notes||"")}</textarea></label>
    <div class="onlyitem" style="display:flex;flex-direction:column;gap:10px">
      <label class="check"><input type="checkbox" id="f_track" ${it.trackValue?"checked":""}><span><b>Track its market price daily</b><br><span class="hint">For bigger things with a resale market, like a car, camera or laptop.</span></span></label>
      <label class="check"><input type="checkbox" id="f_cons" ${it.consumable?"checked":""}><span><b>I run out of this</b><br><span class="hint">Shows a Reorder button and the Refill tag.</span></span></label>
      <label class="check"><input type="checkbox" id="f_heart" ${it.sentimental?"checked":""}><span><b>Sentimental</b></span></label>
    </div>
    <p class="err" id="formErr" hidden></p>
  </form>`;
  const syncKind=()=>{const k=$("#f_kind").value;document.querySelectorAll(".onlyitem").forEach(e=>e.hidden=k!=="item");document.querySelectorAll(".onlyrec").forEach(e=>e.hidden=!(k==="subscription"||k==="bill"));
    if(k==="subscription")$("#f_cat").value="Subscriptions"; if(k==="bill")$("#f_cat").value="Bills"; if(k==="document")$("#f_cat").value="Documents & Cards";};
  $("#f_kind").onchange=syncKind; syncKind();
  const drop=$("#drop");
  const setPreview=blob=>{draftPhoto=blob;drop.querySelector("img")?.remove();const im=document.createElement("img");im.src=URL.createObjectURL(blob);im.alt="";drop.prepend(im);};
  drop.onclick=()=>pickPhoto(setPreview);
  drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pickPhoto(setPreview);}};
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};
  drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");const f=e.dataTransfer.files[0];if(f&&f.type.startsWith("image/"))setPreview(f);};
  if($("#aiFill")) $("#aiFill").onclick=aiFill;
  const f=$("#dFoot"); f.hidden=false;
  f.innerHTML=`<button class="btn ghost" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">${isNew?"Add to inventory":"Save changes"}</button>`;
  $("#cancelBtn").onclick=()=>isNew?closeDrawer():openItem(it.id);
  $("#saveBtn").onclick=()=>saveForm(isNew?null:it);
  $("#itemForm").onsubmit=e=>{e.preventDefault();saveForm(isNew?null:it)};
  $("#dBody").scrollTop=0; openDrawer(); setTimeout(()=>$("#f_name").focus(),250);
}
const numOrNull=v=>{v=String(v||"").replace(/[$,\s]/g,"");return v===""||isNaN(+v)?null:+v;};
async function saveForm(old){
  const name=$("#f_name").value.trim();
  const err=$("#formErr");
  if(!name){err.textContent="Give it a name first.";err.hidden=false;$("#f_name").focus();return;}
  const kind=$("#f_kind").value;
  const d={name,kind,category:$("#f_cat").value,brand:$("#f_brand").value.trim(),notes:$("#f_notes").value.trim()};
  if(kind==="item"){
    Object.assign(d,{price:numOrNull($("#f_price").value),purchased:$("#f_date").value,qty:Math.max(1,parseInt($("#f_qty").value)||1),value:numOrNull($("#f_value").value),
      serial:$("#f_serial").value.trim(),usage:$("#f_usage").value,location:$("#f_loc").value.trim(),buyUrl:$("#f_buy").value.trim(),valueUrl:$("#f_vurl").value.trim(),
      trackValue:$("#f_track").checked,consumable:$("#f_cons").checked,sentimental:$("#f_heart").checked});
  } else if(kind!=="document"){
    Object.assign(d,{cost:numOrNull($("#f_cost").value),period:$("#f_period").value,due:$("#f_due").value.trim(),manageUrl:$("#f_manage").value.trim()});
  }
  const btn=$("#saveBtn"); btn.disabled=true; btn.textContent="Saving…";
  try{
    let id;
    if(old){ id=old.id; if(old.value!==d.value&&d.value!=null){ d.valueUpdated=today(); d.valueSource="Entered by hand"; d.history=(old.history||[]).concat([{d:today(),v:d.value,src:"manual"}]).slice(-180);} await write(id,d); }
    else{
      const no=Math.max(0,...[...items.values()].map(i=>i.no||0))+1;
      id="i"+String(no).padStart(3,"0")+"-"+Math.random().toString(36).slice(2,6);
      Object.assign(d,{no,status:"owned",added:today()});
      if(d.value!=null){d.valueUpdated=today();d.history=[{d:today(),v:d.value,src:"manual"}];}
      clean(d); await db.doc("items/"+id).set(d);
    }
    if(draftPhoto) await savePhoto(id,draftPhoto,true);
    toast(old?"Saved":"Added to your inventory"); openItem(id);
  }catch(e){ err.textContent=writeError(e); err.hidden=false; btn.disabled=false; btn.textContent="Try again"; }
}
function clean(d){ for(const k of Object.keys(d)){ if(d[k]===""||d[k]==null||(d[k]===false)) delete d[k]; } return d; }
async function write(id,patch){
  const next=Object.assign({},items.get(id)||{}); delete next.id;
  for(const [k,v] of Object.entries(patch)){
    if(v===""||v==null||v===false||(v&&typeof v==="object"&&v.__del)) delete next[k]; else next[k]=v;
  }
  await db.doc("items/"+id).set(next);
}
function writeError(e){
  const c=e&&e.code;
  if(c==="invalid_argument") return "You don't have permission to change this inventory.";
  if(c==="quota_exceeded") return "The inventory is full. Remove a few old entries and try again.";
  if(c==="revoked") return "Access to this page changed. Reload to continue.";
  return "Couldn't save just now. Check your connection and try again.";
}

function renderLetGo(it){
  mode="letgo";
  $("#dLabel").textContent="Letting go · "+tagNo(it.no);
  let reason=null;
  $("#dBody").innerHTML=`<div><h2 class="dtitle">${esc(it.name)}</h2><p class="dsub">It moves to <b>Let go</b> with the date and reason, so the history stays.</p></div>
    <div class="reasons" id="reasons">${REASONS.map(([v,l])=>`<button type="button" data-r="${v}" aria-pressed="false">${l}</button>`).join("")}</div>
    <div class="f2"><label class="fld">Date<input id="g_date" type="date" value="${today()}"></label>
    <label class="fld" id="g_amtW">Sold for<input id="g_amt" inputmode="decimal" placeholder="0.00"></label></div>
    <label class="fld">To whom / where <span class="h">optional</span><input id="g_to" placeholder="e.g. Facebook Marketplace, my brother"></label>
    <p class="err" id="goErr" hidden></p>`;
  $("#reasons").onclick=e=>{const b=e.target.closest("button");if(!b)return;reason=b.dataset.r;document.querySelectorAll("#reasons button").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#g_amtW").hidden=reason!=="sold";};
  const f=$("#dFoot"); f.hidden=false;
  f.innerHTML=`<button class="btn ghost" id="gCancel">Keep it</button><button class="btn primary" id="gSave">Move to Let go</button>`;
  $("#gCancel").onclick=()=>openItem(it.id);
  $("#gSave").onclick=async()=>{
    if(!reason){const e=$("#goErr");e.textContent="Pick what happened to it.";e.hidden=false;return;}
    const closed=clean({date:$("#g_date").value||today(),reason,amount:reason==="sold"?numOrNull($("#g_amt").value):null,to:$("#g_to").value.trim()});
    try{ await write(it.id,{status:"gone",closed}); toast("Moved to Let go"); openItem(it.id);}catch(e){const el=$("#goErr");el.textContent=writeError(e);el.hidden=false;}
  };
}

/* photos */
function pickPhoto(cb){ const p=$("#filePick"); p.value=""; p.onchange=()=>{const f=p.files[0]; if(f) cb(f);}; p.click(); }
async function shrink(blob,max=1200){
  try{
    const bmp=await createImageBitmap(blob);
    const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||blob),"image/jpeg",.86));
  }catch(e){ return blob; }
}
async function savePhoto(id,blob,quiet){
  if(!assets){ toast("Photo uploads need edit access."); return; }
  try{
    const small=await shrink(blob);
    const up=await assets.upload(small,{type:small.type&&["image/jpeg","image/png","image/webp","image/gif"].includes(small.type)?small.type:"image/jpeg"});
    await write(id,{photoId:up.id});
    if(!quiet) toast("Photo saved");
  }catch(e){ toast(e&&e.code==="too_large"?"That photo is too big. Try a smaller one.":e&&e.code==="unsupported_type"?"That file type isn't supported. Use JPG or PNG.":"Couldn't save the photo. Try again."); }
}

/* Drive photo import */
let importing=false;
function renderImportNote(){
  const waiting=[...items.values()].filter(i=>i.driveId&&!i.photoId&&!i.photoFailed);
  const n=$("#importNote");
  if(!canWrite||!mcp||!assets||!waiting.length){ if(!importing) n.hidden=true; return; }
  n.hidden=false;
  if(!importing) $("#importText").innerHTML=`<b>${waiting.length} of your photos are still in Google Drive.</b> Bring them in once and they show on every card, for anyone you share this with.`;
}
function b64ToBlob(b64,type){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return new Blob([u],{type}); }
async function importPhotos(){
  if(importing) return; importing=true;
  const waiting=[...items.values()].filter(i=>i.driveId&&!i.photoId&&!i.photoFailed);
  const btn=$("#importBtn"), bar=$("#importBar"), txt=$("#importText");
  btn.disabled=true; bar.hidden=false; let done=0, failed=0;
  const cache={};
  for(const it of waiting){
    txt.textContent=`Bringing in ${it.name}… (${done+1} of ${waiting.length})`;
    try{
      let blob=cache[it.driveId];
      if(!blob){
        const res=await mcp.callTool("Google Drive","download_file_content",{fileId:it.driveId},{cache:false});
        let p=res.payload; if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){}}
        const b64=p&&(p.content||p.data||p.base64Content);
        if(!b64) throw {code:"tool_error"};
        blob=b64ToBlob(b64,(p.mimeType&&p.mimeType.startsWith("image/"))?p.mimeType:"image/jpeg");
        blob=await shrink(blob); cache[it.driveId]=blob;
      }
      const up=await assets.upload(blob,{type:blob.type==="image/png"?"image/png":"image/jpeg"});
      await db.doc("items/"+it.id).update({photoId:up.id});
    }catch(e){
      const c=e&&e.code;
      if(c==="needs_reauth"){txt.textContent="Google Drive needs reconnecting. Reconnect it in claude.ai Settings → Connectors, then try again.";break;}
      if(c==="server_not_connected"||c==="selection_required"){txt.textContent="Add the Google Drive connector in claude.ai Settings → Connectors, then try again.";break;}
      if(c==="not_in_manifest"||c==="consent_required"){txt.textContent="Google Drive access wasn't allowed for this page. Tap the button to be asked again.";break;}
      if(c==="blocked_by_policy"||c==="approval_required"){txt.textContent="Your organization blocks Google Drive here. You can still add photos one at a time.";break;}
      if(c==="quota_or_state"){txt.textContent="Photo storage for this page is full.";break;}
      failed++; try{ await db.doc("items/"+it.id).update({photoFailed:true}); }catch(_){}
    }
    done++; bar.firstElementChild.style.width=(done/waiting.length*100)+"%";
  }
  importing=false; btn.disabled=false; bar.hidden=true;
  const left=[...items.values()].filter(i=>i.driveId&&!i.photoId&&!i.photoFailed).length;
  if(!left){ toast(failed?`Photos in. ${failed} couldn't be opened; add those by hand.`:"All your photos are in"); renderImportNote(); }
}

/* Claude autofill */
async function aiFill(){
  const name=$("#f_name").value.trim(); if(!name){ $("#f_name").focus(); return; }
  const b=$("#aiFill"); b.disabled=true; const old=b.innerHTML; b.textContent="Asking Claude…";
  try{
    const r=await sample.json(`You help catalogue a personal home inventory. Given an item name (and brand if known), return JSON only with keys:
brand (string or ""), category (one of: ${ALL_CATS.join(", ")}), kind ("item"|"subscription"|"bill"|"document"), estimatedNewPrice (number USD or null), consumable (true if it's something people run out of and rebuy), trackValue (true only for items with a meaningful used resale market worth over about $100, like electronics, cameras, vehicles, instruments), notes (one short factual line or "").
Item: ${JSON.stringify(name)}${$("#f_brand").value?" Brand: "+JSON.stringify($("#f_brand").value):""}`,{modelTier:"quick"});
    if(r){
      if(r.brand&&!$("#f_brand").value) $("#f_brand").value=r.brand;
      if(r.kind){$("#f_kind").value=r.kind;$("#f_kind").onchange();}
      if(r.category&&ALL_CATS.includes(r.category)) $("#f_cat").value=r.category;
      if(r.estimatedNewPrice&&!$("#f_price").value) $("#f_price").value=r.estimatedNewPrice;
      $("#f_cons").checked=!!r.consumable; $("#f_track").checked=!!r.trackValue;
      if(r.notes&&!$("#f_notes").value) $("#f_notes").value=r.notes;
      toast("Filled in. Check it over.");
    }
  }catch(e){ toast(e&&e.code==="rate_limited"?"Claude is busy. Try again in a minute.":"Couldn't fill it in this time."); }
  b.disabled=false; b.innerHTML=old;
}

/* export */
async function exportCsv(){
  const cols=[["no","No."],["name","Item"],["brand","Brand"],["category","Category"],["kind","Type"],["status","Status"],["qty","Qty"],["price","Price paid"],["purchased","Date bought"],["value","Current value"],["valueUpdated","Value checked"],["cost","Recurring cost"],["period","Every"],["due","Due"],["serial","Serial/model"],["usage","Usage"],["location","Kept at"],["notes","Notes"]];
  const rows=[cols.map(c=>c[1])].concat(sorted([...items.values()]).map(i=>cols.map(([k])=>i[k]??"")));
  const csv=rows.map(r=>r.map(v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")).join("\n");
  try{ await downloads.save({filename:"everything-i-own-"+today()+".csv",data:new Blob([csv],{type:"text/csv"})}); }catch(e){ if(e&&e.code!=="cancelled") toast("Couldn't create the file."); }
}

$("#chips").addEventListener("click",e=>{const c=e.target.closest(".chip"); if(!c) return;
  if(c.dataset.flag!==undefined){ flag=flag===c.dataset.flag?null:c.dataset.flag; } else { cat=c.dataset.cat||null; if(!c.dataset.cat) flag=null; }
  render();});
$("#tabs").addEventListener("click",e=>{const t=e.target.closest(".tab"); if(!t) return; tab=t.dataset.tab; cat=null; flag=null;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t)); render();});
$("#q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase(); render();});
$("#sort").addEventListener("change",e=>{sort=e.target.value; try{localStorage.setItem("inv.sort",sort)}catch(_){} render();});
$("#vGrid").onclick=()=>{layout="grid";try{localStorage.setItem("inv.layout",layout)}catch(_){} render();};
$("#vList").onclick=()=>{layout="list";try{localStorage.setItem("inv.layout",layout)}catch(_){} render();};
$("#dClose").onclick=closeDrawer; $("#scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#drawer").classList.contains("on")) closeDrawer();});
$("#addBtn").onclick=()=>renderForm(null); $("#fab").onclick=()=>renderForm(null);
$("#importBtn").onclick=importPhotos;

/* boot: public snapshot */
(function boot(){
  let data={items:[]};
  try{ data=JSON.parse(document.getElementById("inv-data").textContent); }catch(e){}
  items=new Map(data.items.map(d=>[d.id,d]));
  loaded=true; canWrite=false;
  if(data.updated) $("#who").textContent="Erik's personal inventory · updated "+fmtDate(data.updated);
  render();
})();
})();
